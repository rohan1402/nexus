[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-pipeline"
version = "0.1.0"
description = "Nexus — a multi-agent bug-fix pipeline (Lyzr ADK + Gemini 2.5 Pro)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lyzr-adk>=0.1.10",
    "PyGithub>=2.3.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nexus = "nexus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
